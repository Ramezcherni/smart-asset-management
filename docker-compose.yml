services:
  backend:
    build: ./backend
    container_name: sam-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sam-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped